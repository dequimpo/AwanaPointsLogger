name: deploy-frontend-cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".env.production.example"
      - "config/**"
      - "screens/**"
      - "services/**"
      - ".github/workflows/deploy-frontend-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_AZURE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AZURE_CLIENT_ID }}
          EXPO_PUBLIC_AZURE_TENANT_ID: ${{ vars.EXPO_PUBLIC_AZURE_TENANT_ID }}
          EXPO_PUBLIC_AZURE_AUTH_SCOPES: ${{ vars.EXPO_PUBLIC_AZURE_AUTH_SCOPES }}
          EXPO_PUBLIC_WEB_REDIRECT_URI: ${{ vars.EXPO_PUBLIC_WEB_REDIRECT_URI }}
          EXPO_PUBLIC_ENVIRONMENT: production
        run: npx expo export --platform web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
